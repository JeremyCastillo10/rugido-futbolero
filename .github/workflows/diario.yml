name: Episodio diario

on:
  schedule:
    # Cada hora de 8:00 a. m. a 6:00 p. m. (hora de República Dominicana).
    # Solo genera si hoy aún no se publicó, así que los reintentos no gastan cupo.
    - cron: "0 12-22 * * *"
  workflow_dispatch:
    inputs:
      publicar:
        description: "¿Publicar en Instagram?"
        type: boolean
        default: true
      forzar:
        description: "Generar aunque hoy ya se haya publicado"
        type: boolean
        default: false

# Una ejecución a la vez: si una tarda más de una hora, la siguiente espera
concurrency:
  group: episodio-diario
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    outputs:
      falta: ${{ steps.revisar.outputs.falta }}
    steps:
      - uses: actions/checkout@v4
      - id: revisar
        run: |
          HOY=$(TZ=America/Santo_Domingo date +%F)
          PUBLICADO=$(python3 -c "import json; print(json.load(open('data/episodio_publicado.json')).get('fecha', ''))" 2>/dev/null || true)
          echo "Hoy $HOY, último publicado: $PUBLICADO"
          if [ "$PUBLICADO" = "$HOY" ]; then echo "falta=no" >> "$GITHUB_OUTPUT"; else echo "falta=si" >> "$GITHUB_OUTPUT"; fi

  episodio:
    needs: revisar
    if: (github.event_name == 'workflow_dispatch' && inputs.forzar) || needs.revisar.outputs.falta == 'si'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Dependencias de Chrome para Remotion
        run: npx remotion browser ensure
      - name: Guion
        run: python scripts/guion.py
      - name: Fotos libres
        run: python scripts/fotos.py
      - name: Voces
        run: python scripts/voces.py
      - name: Render
        run: npx remotion render Noticiero out/episodio.mp4 --gl=swangle
      - uses: actions/upload-artifact@v4
        with:
          name: episodio
          path: |
            out/episodio.mp4
            public/episodio.json
          retention-days: 14
      - id: ig
        name: Publicar en Instagram
        if: github.event_name == 'schedule' || inputs.publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publicar.py
      - name: Publicar en Facebook
        if: (github.event_name == 'schedule' || inputs.publicar) && env.FB_PAGE_TOKEN != ''
        run: python scripts/facebook.py reel
      - name: Guardar fecha publicada
        if: steps.ig.outcome == 'success'
        run: |
          echo "{\"fecha\": \"$(TZ=America/Santo_Domingo date +%F)\"}" > data/episodio_publicado.json
          git config user.name "rugido-bot"
          git config user.email "rugido-bot@users.noreply.github.com"
          git add data/episodio_publicado.json
          git diff --cached --quiet || (git commit -m "Episodio publicado" && git pull --rebase -q && git push)
